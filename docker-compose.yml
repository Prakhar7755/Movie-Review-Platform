services:
  mongodb:
    image: mongo:7
    container_name: movie-review-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - movie-network
    profiles:
      - local

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: movie-review-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5001
    networks:
      - movie-network

  nginx:
    image: nginx:alpine
    container_name: movie-review-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - movie-network

volumes:
  mongodb_data:

networks:
  movie-network: